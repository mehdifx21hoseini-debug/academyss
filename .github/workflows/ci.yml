# CI برای کد MENTORAI.
#
# هدف این نیست که «تست‌ها سبز باشند». هدف این است که هیچ تغییری بی‌صدا از
# بررسی رد نشود. پس روی هر پوش و هر PR اجرا می‌شود، نه فقط روی شاخه‌ی اصلی.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# اجرای قدیمی همان شاخه لغو می‌شود؛ فقط آخرین حالت کد اهمیت دارد.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mentorai

jobs:
  check:
    name: lint · types · migrations · tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        # همان تصویری که docker-compose استفاده می‌کند: پستگرس ۱۶ به‌همراه pgvector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mentorai
          POSTGRES_PASSWORD: mentorai
          POSTGRES_DB: mentorai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mentorai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # همان مقادیری که tests/conftest.py پیش‌فرض می‌گذارد. اینجا صریح نوشته شده‌اند
      # تا اگر پیش‌فرض عوض شد، CI هم عمداً عوض شود نه اتفاقی.
      DATABASE_URL: postgresql+asyncpg://mentorai:mentorai@localhost:5432/mentorai_test
      SESSION_ENCRYPTION_KEY: TfB5m6h0nsGGmZ2Zt2sD1u9wY9NClsMkVQ8mXvJqZ7A=
      TELEGRAM_API_ID: '12345'
      TELEGRAM_API_HASH: test-hash
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # افزونه‌ها در محیط تولید با اسکریپت initdb و ابرکاربر ساخته می‌شوند
      # (docker/initdb/01-extensions.sql). سرویس‌های GitHub اسکریپت initdb سوار
      # نمی‌کنند، پس همان کار اینجا صریح انجام می‌شود.
      - name: Create database extensions
        run: |
          PGPASSWORD=mentorai psql -h localhost -U mentorai -d mentorai_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      # از فایل قفل با هش. اگر بسته‌ای روی PyPI عوض شده باشد، همین‌جا شکست می‌خورد.
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Install the package
        run: pip install --no-deps .

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      # مهاجرت‌ها فقط «اجرا می‌شوند» کافی نیست؛ باید برگشت‌پذیر هم باشند. این گام
      # روی یک پایگاه داده‌ی جدا اجرا می‌شود تا با پایگاه داده‌ی تست تداخل نکند.
      - name: Validate migrations are reversible
        env:
          DATABASE_URL: postgresql+asyncpg://mentorai:mentorai@localhost:5432/mentorai_migrations
        run: |
          PGPASSWORD=mentorai createdb -h localhost -U mentorai mentorai_migrations
          PGPASSWORD=mentorai psql -h localhost -U mentorai -d mentorai_migrations \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Tests
        run: pytest -q

  build:
    name: docker image builds from the lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ساخت واقعی تصویر. این تنها جایی است که مسیر
      # `pip install --require-hashes` روی همان تصویر پایه‌ی تولید آزموده می‌شود.
      - name: Build image
        run: docker build -t mentorai:ci mentorai

      - name: The entrypoint runs inside the image
        run: docker run --rm mentorai:ci mentorai --help
