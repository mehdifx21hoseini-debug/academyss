services:
  db:
    # تصویر رسمی pgvector: همان پستگرس ۱۶ به‌همراه افزونه‌ی برداری.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mentorai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD لازم است}
      POSTGRES_DB: mentorai
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentorai"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
