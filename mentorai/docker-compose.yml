services:
  db:
    # تصویر رسمی pgvector: همان پستگرس ۱۶ به‌همراه افزونه‌ی برداری.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mentorai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD لازم است}
      POSTGRES_DB: mentorai
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentorai"]
      interval: 5s
      timeout: 3s
      retries: 20

  # کل سیستم: دریافت پیام، ساخت پیش‌نویس، ربات کنترل، و ارسال.
  #
  # `run-worker` عمداً تنها فرایند بلندمدت است. هر فرایندی که به یک حساب وصل شود یک
  # اتصال تازه با همان نشست می‌سازد، و دو اتصال هم‌زمان روی یک نشست هم ترافیک اضافه
  # است و هم برای تلگرام سیگنال. یک حساب، یک فرایند (ADR-020).
  app:
    build: .
    command: ["mentorai", "run-worker"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # فقط برای دستورهای تک‌باره: مهاجرت، ورود حساب، وارد کردن دانش، ساخت کاربر پنل.
  # پروفایل دارد تا با `docker compose up` بالا نیاید — اگر بالا بیاید، اتصال دوم
  # همان حساب می‌شود. `docker compose run` خودش پروفایلش را فعال می‌کند.
  cli:
    build: .
    profiles: ["tools"]
    env_file: .env
    # خروجی پایگاه دانش فقط-خواندنی سوار می‌شود تا `kb-import` روی هر سیستم‌عاملی یک
    # دستور ساده باشد و به مسیردهی دستی نیاز نداشته باشد.
    volumes:
      - ../exports/core:/kb:ro
    depends_on:
      db:
        condition: service_healthy

  # فقط روی لوکال‌هاست باز می‌شود. پنل باید پشت یک پروکسی با HTTPS بیاید، وگرنه
  # کوکی نشست که علامت secure دارد اصلاً ذخیره نمی‌شود و ورود کار نمی‌کند.
  panel:
    build: .
    command:
      ["python", "-m", "uvicorn", "mentorai.web.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # رونویسی ویس، روی همین سرور (ADR-033). صدای دانشجو از سرور بیرون نمی‌رود.
  #
  # پروفایل `voice` دارد: با `docker compose --profile voice up -d` بالا می‌آید. حدود
  # چهار گیگ حافظه می‌گیرد، پس روی سرور چهارگیگی جا نمی‌شود — `docs/PILOT.md`.
  #
  # هیچ درگاهی بیرون باز نمی‌شود. فقط `app` از شبکه‌ی داخلی به آن می‌رسد، با
  # TRANSCRIBER_URL=http://transcriber:8000/v1
  #
  # `app` به این سرویس وابسته نیست، عمداً: اگر رونویسی بیفتد، ویس مثل قبل به منتور
  # می‌رود و بقیه‌ی سیستم کار می‌کند.
  transcriber:
    build: ./transcriber
    profiles: ["voice"]
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-180}
    volumes:
      - whisper_models:/models
    expose:
      - "8000"
    restart: unless-stopped

volumes:
  db_data:
  whisper_models:
